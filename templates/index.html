<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Wall Controller</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #2d2d2d;
            --border-light: #555;
            --border-dark: #111;
            --text: #e0e0e0;
            --online: #00ff41;
            --offline: #ff2a2a;
        }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        /* 2x20 Grid Setup */
        .wall-grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(2, auto);
            gap: 4px;
            margin-bottom: 20px;
        }

        /* 9:16 Cells with Sharp 3D Motif */
        .display-cell {
            aspect-ratio: 9 / 16;
            background: var(--panel);
            border: 1px solid var(--border-dark);
            box-shadow: 
                inset 2px 2px 0px rgba(255,255,255,0.1), 
                inset -2px -2px 0px rgba(0,0,0,0.6),
                2px 2px 4px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.05s linear;
        }

        .display-cell:active {
            box-shadow: 
                inset 2px 2px 0px rgba(0,0,0,0.6), 
                inset -2px -2px 0px rgba(255,255,255,0.1);
            transform: translate(1px, 1px);
        }

        .display-cell.selected {
            background: #3d4f5d;
            border-color: #00a8ff;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: var(--offline);
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
            margin-top: 4px;
        }

        .status-indicator.online { background: var(--online); }

        .cell-id { font-weight: bold; font-size: 0.9rem; }

        /* Power User Control Panel */
        .control-panel {
            flex-grow: 1;
            background: var(--panel);
            border: 1px solid var(--border-dark);
            box-shadow: 
                inset 2px 2px 0px rgba(255,255,255,0.1), 
                inset -2px -2px 0px rgba(0,0,0,0.6);
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        /* Hardware-style Buttons */
        button {
            background: linear-gradient(180deg, #4a4a4a 0%, #2d2d2d 100%);
            color: var(--text);
            border: 1px solid var(--border-dark);
            border-radius: 0; /* Strict sharp corners */
            padding: 8px 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 
                inset 1px 1px 0px rgba(255,255,255,0.2), 
                inset -1px -1px 0px rgba(0,0,0,0.5),
                2px 2px 3px rgba(0,0,0,0.3);
        }

        button:active {
            background: #2d2d2d;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.8);
            transform: translate(1px, 1px);
        }

        button.danger { background: linear-gradient(180deg, #7a2a2a 0%, #4a1a1a 100%); }
    </style>
</head>
<body>

    <div class="wall-grid" id="grid">
        <!-- Cells generated by JS -->
    </div>

    <div class="control-panel">
        <div class="panel-header" id="panel-title">SELECT A DISPLAY</div>
        
        <div class="action-group" id="controls" style="display: none;">
            <button onclick="sendCommand('power', 'on')">PWR ON</button>
            <button class="danger" onclick="sendCommand('power', 'off')">PWR OFF</button>
            <span style="margin: 0 15px; border-left: 1px solid var(--border-light); height: 20px;"></span>
            <button onclick="sendCommand('source', 'HDMI1')">HDMI 1</button>
            <button onclick="sendCommand('source', 'HDMI2')">HDMI 2</button>
            <button onclick="sendCommand('source', 'DisplayPort')">DP</button>
        </div>
    </div>

    <script>
        let selectedId = null;

        // Initialize Grid
        const grid = document.getElementById('grid');
        for (let i = 1; i <= 40; i++) {
            const cell = document.createElement('div');
            cell.className = 'display-cell';
            cell.id = `cell-${i}`;
            cell.innerHTML = `
                <div class="status-indicator" id="status-${i}"></div>
                <div class="cell-id">${String(i).padStart(2, '0')}</div>
                <div style="font-size: 0.6rem" id="pwr-${i}">---</div>
            `;
            cell.onclick = () => selectDisplay(i);
            grid.appendChild(cell);
        }

        function selectDisplay(id) {
            if (selectedId) document.getElementById(`cell-${selectedId}`).classList.remove('selected');
            selectedId = id;
            document.getElementById(`cell-${id}`).classList.add('selected');
            
            document.getElementById('panel-title').innerText = `DISPLAY ${String(id).padStart(2, '0')} CONFIGURATION`;
            document.getElementById('controls').style.display = 'flex';
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                for (let i = 1; i <= 40; i++) {
                    const statusDiv = document.getElementById(`status-${i}`);
                    const pwrDiv = document.getElementById(`pwr-${i}`);
                    
                    if (data[i].status === 'online') {
                        statusDiv.className = 'status-indicator online';
                        pwrDiv.innerText = data[i].power;
                    } else {
                        statusDiv.className = 'status-indicator';
                        pwrDiv.innerText = 'OFFLINE';
                    }
                }
            } catch (e) {
                console.error("Failed to fetch status");
            }
        }

        async function sendCommand(command, value) {
            if (!selectedId) return;
            await fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: selectedId, command, value })
            });
            // Force an immediate UI update
            updateStatus();
        }

        // Poll frontend every 2 seconds to reflect backend cache
        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
