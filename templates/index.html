<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Wall Controller</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #2d2d2d;
            --border-light: #555;
            --border-dark: #111;
            --text: #e0e0e0;
        }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .wall-container {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .wall-grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(2, auto);
            gap: 4px;
        }

        /* 9:16 Cells with Sharp Edges, CRT Glass Sheen & Steeper Glow */
        .display-cell {
            aspect-ratio: 9 / 16;
            border: 1px solid var(--border-dark);
            
            box-shadow: 
                inset 2px 2px 0px rgba(255,255,255,0.15), 
                inset -2px -2px 0px rgba(0,0,0,0.7),
                2px 2px 4px rgba(0,0,0,0.4);
            
            /* Stronger offline glow */
            --glow-color: rgba(255, 20, 20, 0.9); 
            
            /* 
               Layer 1: Intense glow with steep 35% fall-off
               Layer 2: Glass sheen with a sharp diagonal cutoff at 45%-46%
               Layer 3: CRT Vignette/Emboss
            */
            background-image: 
                radial-gradient(circle at 0% 0%, var(--glow-color) 0%, transparent 35%),
                linear-gradient(110deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0) 46%, rgba(0,0,0,0.25) 100%),
                linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 10%, rgba(0,0,0,0) 90%, rgba(0,0,0,0.5) 100%);
            background-color: var(--panel);
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 4px 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: transform 0.05s linear;
        }

        .display-cell.online {
            /* Stronger online glow */
            --glow-color: rgba(0, 255, 40, 0.9);
        }

        .display-cell:active {
            box-shadow: 
                inset 2px 2px 0px rgba(0,0,0,0.6), 
                inset -2px -2px 0px rgba(255,255,255,0.1);
            transform: translate(1px, 1px);
        }

        .display-cell.selected {
            border-color: #00a8ff;
            background-color: #3d4f5d;
        }

        .cell-id { 
            font-weight: bold; 
            font-size: 0.9rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .cell-pwr {
            font-size: 0.6rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* Power User Control Panel (Bottom Edge) */
        .control-panel {
            flex-shrink: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            
            background-color: #0c0c0c;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            
            border: none;
            box-shadow: 0px -4px 10px rgba(0,0,0,0.5);
        }

        .panel-header {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }

        .action-group {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
            align-items: center;
        }

        button {
            background: linear-gradient(180deg, #4a4a4a 0%, #2d2d2d 100%);
            color: var(--text);
            border: 1px solid var(--border-dark);
            border-radius: 0; 
            padding: 8px 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 
                inset 1px 1px 0px rgba(255,255,255,0.2), 
                inset -1px -1px 0px rgba(0,0,0,0.5),
                2px 2px 3px rgba(0,0,0,0.3);
        }

        button:active {
            background: #2d2d2d;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.8);
            transform: translate(1px, 1px);
        }

        button.danger { background: linear-gradient(180deg, #7a2a2a 0%, #4a1a1a 100%); }
    </style>
</head>
<body>

    <div class="wall-container">
        <div class="wall-grid" id="grid">
            <!-- Cells generated by JS -->
        </div>
    </div>

    <div class="control-panel">
        <div class="panel-header" id="panel-title">SELECT A DISPLAY</div>
        
        <div class="action-group" id="controls" style="display: none;">
            <button onclick="sendCommand('power', 'on')">PWR ON</button>
            <button class="danger" onclick="sendCommand('power', 'off')">PWR OFF</button>
            <span style="margin: 0 15px; border-left: 1px solid #333; height: 20px;"></span>
            <button onclick="sendCommand('source', 'HDMI1')">HDMI 1</button>
            <button onclick="sendCommand('source', 'HDMI2')">HDMI 2</button>
            <button onclick="sendCommand('source', 'DisplayPort')">DP</button>
        </div>
    </div>

    <script>
        let selectedId = null;

        const grid = document.getElementById('grid');
        for (let i = 1; i <= 40; i++) {
            const cell = document.createElement('div');
            cell.className = 'display-cell';
            cell.id = `cell-${i}`;
            cell.innerHTML = `
                <div class="cell-id">${String(i).padStart(2, '0')}</div>
                <div class="cell-pwr" id="pwr-${i}">---</div>
            `;
            cell.onclick = () => selectDisplay(i);
            grid.appendChild(cell);
        }

        function selectDisplay(id) {
            if (selectedId) document.getElementById(`cell-${selectedId}`).classList.remove('selected');
            selectedId = id;
            document.getElementById(`cell-${id}`).classList.add('selected');
            
            document.getElementById('panel-title').innerText = `DISPLAY ${String(id).padStart(2, '0')} CONFIGURATION`;
            document.getElementById('controls').style.display = 'flex';
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                for (let i = 1; i <= 40; i++) {
                    const cell = document.getElementById(`cell-${i}`);
                    const pwrDiv = document.getElementById(`pwr-${i}`);
                    
                    if (data[i].status === 'online') {
                        cell.classList.add('online');
                        pwrDiv.innerText = data[i].power;
                    } else {
                        cell.classList.remove('online');
                        pwrDiv.innerText = 'OFFLINE';
                    }
                }
            } catch (e) {
                console.error("Failed to fetch status");
            }
        }

        async function sendCommand(command, value) {
            if (!selectedId) return;
            await fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: selectedId, command, value })
            });
            updateStatus();
        }

        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
